<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <style>
    .title { font-size: 15px; font-weight: bold; fill: #111; }
    .sub { font-size: 13px; font-weight: bold; fill: #333; }
    .note { font-size: 12px; fill: #444; }
    .box { stroke: #333; stroke-width: 1.5; fill: #ffffff; }
    .nest { stroke: #333; stroke-width: 1.3; fill: #eef4fb; }
    .lbl { font-size: 12px; fill: #111; }
    .arrow { stroke: #555; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .center { fill: #a7d8a0; }
    .neighbor { fill: #eef4fb; }
    .dot { fill: #c62828; }
    .radius { fill: none; stroke: #c62828; stroke-width: 1.6; stroke-dasharray: 5,3; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- TOP: nesting -->
  <text x="20" y="26" class="title">1. Prefix nesting — each extra character narrows the cell</text>

  <rect x="20"  y="45" width="90" height="70" class="box"/>
  <text x="65" y="85" text-anchor="middle" class="lbl">world</text>

  <rect x="150" y="55" width="70" height="50" class="nest"/>
  <text x="185" y="85" text-anchor="middle" class="lbl">"9q"</text>

  <rect x="260" y="62" width="55" height="36" class="nest"/>
  <text x="287" y="84" text-anchor="middle" class="lbl" font-size="11">"9q8"</text>

  <rect x="355" y="67" width="40" height="26" class="nest"/>
  <text x="375" y="84" text-anchor="middle" class="lbl" font-size="10">"9q8y"</text>

  <path d="M112,80 L148,80" class="arrow"/>
  <path d="M222,80 L258,80" class="arrow"/>
  <path d="M317,80 L353,80" class="arrow"/>

  <text x="440" y="72" class="note">4 leaf cells inside "9q8y":</text>
  <rect x="440" y="80" width="34" height="24" class="box"/>
  <text x="457" y="96" text-anchor="middle" font-size="10">9q8yy</text>
  <rect x="478" y="80" width="34" height="24" class="box"/>
  <text x="495" y="96" text-anchor="middle" font-size="10">9q8yz</text>
  <rect x="440" y="106" width="34" height="24" class="box"/>
  <text x="457" y="122" text-anchor="middle" font-size="10">9q8yv</text>
  <rect x="478" y="106" width="34" height="24" class="box"/>
  <text x="495" y="122" text-anchor="middle" font-size="10">9q8yw</text>

  <text x="20" y="150" class="note">searching prefix "9q8yy%" only matches this cell and cells nested inside it</text>

  <line x1="20" y1="175" x2="760" y2="175" stroke="#ccc" stroke-width="1"/>

  <!-- BOTTOM: boundary problem + 9-cell neighbor query -->
  <text x="20" y="205" class="title">2. Boundary problem — query the center cell + 8 neighbors</text>

  <g transform="translate(40,225)">
    <rect x="0"   y="0"  width="80" height="60" class="neighbor box"/>
    <text x="40" y="15" text-anchor="middle" font-size="10">NW</text>
    <rect x="84"  y="0"  width="80" height="60" class="neighbor box"/>
    <text x="124" y="15" text-anchor="middle" font-size="10">N</text>
    <rect x="168" y="0"  width="80" height="60" class="neighbor box"/>
    <text x="208" y="15" text-anchor="middle" font-size="10">NE</text>

    <rect x="0"   y="64" width="80" height="60" class="neighbor box"/>
    <text x="40" y="79" text-anchor="middle" font-size="10">W</text>
    <rect x="84"  y="64" width="80" height="60" class="center box"/>
    <text x="124" y="79" text-anchor="middle" font-size="10" font-weight="bold">CENTER</text>
    <rect x="168" y="64" width="80" height="60" class="neighbor box"/>
    <text x="208" y="79" text-anchor="middle" font-size="10">E</text>

    <rect x="0"   y="128" width="80" height="60" class="neighbor box"/>
    <text x="40" y="143" text-anchor="middle" font-size="10">SW</text>
    <rect x="84"  y="128" width="80" height="60" class="neighbor box"/>
    <text x="124" y="143" text-anchor="middle" font-size="10">S</text>
    <rect x="168" y="128" width="80" height="60" class="neighbor box"/>
    <text x="208" y="143" text-anchor="middle" font-size="10">SE</text>

    <!-- two points near a shared boundary, different cells -->
    <circle cx="80"  cy="80" r="4" class="dot"/>
    <circle cx="88"  cy="76" r="4" class="dot"/>
    <circle cx="128" cy="78" r="46" class="radius"/>
    <text x="124" y="205" text-anchor="middle" class="note" fill="#c62828">two points 8m apart, different geohash prefix — a 1-cell query alone misses one</text>
  </g>

  <text x="420" y="245" class="sub">SQL: 9 prefix scans, one per cell</text>
  <text x="420" y="268" class="note">WHERE geohash LIKE 'center%'</text>
  <text x="420" y="286" class="note">   OR geohash LIKE 'n%' OR 's%' OR 'e%' OR 'w%'</text>
  <text x="420" y="304" class="note">   OR geohash LIKE 'ne%' OR 'nw%' OR 'se%' OR 'sw%'</text>
  <text x="420" y="330" class="note">then apply an exact distance filter (haversine)</text>
  <text x="420" y="348" class="note">on the returned candidates — the grid gives</text>
  <text x="420" y="366" class="note">rectangles, the real search area is a circle.</text>
</svg>
